<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MSM DAQ E2E Test - Data Inspector</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
body{background:#1a1a2e;color:#eee;font-family:monospace;margin:20px}
h1{font-size:16px;margin:0 0 8px}
.ctrlbar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ctrlbar button{background:#1a3a5c;border:none;color:#fff;padding:6px 18px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:bold}
.ctrlbar button:hover{filter:brightness(1.3)}
.ctrlbar button.sgo{background:#1a5c3a}
.ctrlbar button.stp{background:#5c1a1a}
.ctrlbar button.on{background:#2a5a3a}
.ctrlbar button.off{background:#5a2a2a}
.ctrlbar span{color:#888;font-size:12px;line-height:30px}
.stats{display:flex;gap:12px;margin-bottom:8px;font-size:12px;flex-wrap:wrap}
.stats span{background:#16213e;padding:3px 10px;border-radius:4px}
.cr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cb{background:#16213e;border-radius:8px;padding:10px}
.cb h3{font-size:12px;color:#888;margin:0 0 6px}
canvas{width:100% !important;height:180px !important}
.inspector{background:#0d1b2a;border-radius:8px;padding:12px;margin-top:8px}
.inspector .ctrl{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.inspector .ctrl input[type=number]{width:80px;background:#16213e;border:1px solid #333;color:#0f0;padding:4px 8px;border-radius:4px;font-size:14px;text-align:center}
.inspector .ctrl input[type=number]:focus{outline:none;border-color:#0f0}
.inspector .ctrl button{background:#1a3a5c;border:none;color:#fff;padding:4px 14px;border-radius:4px;cursor:pointer;font-size:14px}
.inspector .ctrl button:hover{background:#2a5a8c}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:3px 6px;text-align:center;border-bottom:1px solid #1a2a3e}
th{color:#888}
td.val{color:#0f0}
td.del{color:#ffa;font-size:10px}
td.del.ok{color:#0f0}
td.del.fail{color:#f44}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.nav input[type=range]{flex:1;accent-color:#0f0;height:4px}
</style>
</head>
<body>
<h1>MSM DAQ — 4ch x 10k帧 数据探查</h1>
<div class="ctrlbar">
  <button class="sgo" onclick="sendCmd('Start >> ->| Storage',200);sendCmd('Start >> ->| Process',200);sendCmd('Start >> ->| DAQModule')">&#9654; Start All</button>
  <button class="stp" onclick="sendCmd('Stop >> ->| DAQModule',100);sendCmd('Stop >> ->| Process',100);sendCmd('Stop >> ->| Storage')">&#9632; Stop All</button>
  <span>|</span>
  <button class="on" onclick="sendCmd('SaveEnable >> ->| Storage')">Save ON</button>
  <button class="off" onclick="sendCmd('SaveDisable >> ->| Storage')">Save OFF</button>
  <span style="flex:1"></span>
  <button style="background:#5c5c1a" onclick="sendCmd('RELOAD')">&#8635; Reload</button>
  <button style="background:#5c1a1a" onclick="if(confirm('Exit backend?'))sendCmd('QUIT')">&#9632; Exit</button>
  <span id="ctrlStatus">—</span>
</div>
<div class="stats">
  <span>接收: <b id="rcv">0</b></span>
  <span>批次: <b id="seq">0</b></span>
  <span>校验: <b id="verify">—</b></span>
</div>

<div class="cr">
  <div class="cb"><h3>TrigID</h3><canvas id="cTrig"></canvas></div>
  <div class="cb"><h3>BunchID</h3><canvas id="cBunch"></canvas></div>
  <div class="cb"><h3>Sum</h3><canvas id="cSum"></canvas></div>
  <div class="cb"><h3>XYI (Ch1)</h3><canvas id="cXYI"></canvas></div>
</div>

<div class="inspector">
  <div class="ctrl">
    <button onclick="stepFrame(-100)">&laquo;&laquo;</button>
    <button onclick="stepFrame(-1)">&laquo;</button>
    <span>帧 #<b id="fi">0</b> / <span id="fm">0</span></span>
    <button onclick="stepFrame(1)">&raquo;</button>
    <button onclick="stepFrame(100)">&raquo;&raquo;</button>
    <input type="number" id="fn" min="0" value="0" onchange="jumpFrame(+this.value)">
  </div>
  <div class="nav">
    <input type="range" id="fs" min="0" max="0" value="0" oninput="jumpFrame(+this.value)">
  </div>
  <table id="ft">
    <tr><th>Ch</th><th>TrigID</th><th>&Delta;</th><th>BunchID</th><th>&Delta;</th><th>Sum</th><th>&Delta;</th><th>X</th><th>Y</th><th>I</th></tr>
  </table>
</div>

<script>
const CC=["#00ff88","#ff8844","#44aaff","#ff44aa"];
const N=4, MC=10000;
let rd=null, cf=0;

function mkC(id,f){
  return new Chart(document.getElementById(id),{
    type:"line",
    data:{labels:Array(MC).fill(""),datasets:Array.from({length:N},(_,i)=>({
      label:f(i),data:Array(MC).fill(null),
      borderColor:CC[i],backgroundColor:"transparent",
      pointRadius:0,borderWidth:1.2
    }))},
    options:{animation:false,responsive:true,maintainAspectRatio:false,
      scales:{x:{display:true,ticks:{color:"#666",maxTicksLimit:8,font:{size:9}}},
              y:{display:true,ticks:{color:"#888",maxTicksLimit:6,font:{size:9}}}},
      plugins:{legend:{labels:{color:"#aaa",boxWidth:10,font:{size:10}}}}}
  });
}

function mkC1(id,datasets){
  return new Chart(document.getElementById(id),{
    type:"line",
    data:{labels:Array(MC).fill(""),datasets:datasets},
    options:{animation:false,responsive:true,maintainAspectRatio:false,
      scales:{x:{display:true,ticks:{color:"#666",maxTicksLimit:8,font:{size:9}}},
              y:{display:true,ticks:{color:"#888",maxTicksLimit:6,font:{size:9}}}},
      plugins:{legend:{labels:{color:"#aaa",boxWidth:10,font:{size:10}}}}}
  });
}

const cT=mkC("cTrig",i=>"Ch"+(i+1));
const cB=mkC("cBunch",i=>"Ch"+(i+1));
const cS=mkC("cSum",i=>"Ch"+(i+1));
const cXYI=mkC1("cXYI",[
  {label:"X",data:Array(MC).fill(null),borderColor:"#00ff88",backgroundColor:"transparent",pointRadius:0,borderWidth:1.2},
  {label:"Y",data:Array(MC).fill(null),borderColor:"#ff8844",backgroundColor:"transparent",pointRadius:0,borderWidth:1.2},
  {label:"I",data:Array(MC).fill(null),borderColor:"#ff44aa",backgroundColor:"transparent",pointRadius:0,borderWidth:1.2}
]);

function ds(a,n){return a?a.slice(0,n):[]}

function stepFrame(d){if(!rd)return;const n=rd[0]&&rd[0].batch?rd[0].batch.trig_id.length:0;if(!n)return;cf=Math.max(0,Math.min(n-1,cf+d));upd()}
function jumpFrame(v){if(!rd)return;const n=rd[0]&&rd[0].batch?rd[0].batch.trig_id.length:0;if(!n)return;cf=Math.max(0,Math.min(n-1,parseInt(v)||0));upd()}
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){stepFrame(-1);e.preventDefault()}if(e.key==="ArrowRight"){stepFrame(1);e.preventDefault()}})

function upd(){
  if(!rd)return;const n=rd[0]&&rd[0].batch?rd[0].batch.trig_id.length:0;if(!n)return;
  document.getElementById("fi").textContent=cf;
  document.getElementById("fs").value=cf;
  document.getElementById("fn").value=cf;
  let h='<tr><th>Ch</th><th>TrigID</th><th>&Delta;</th><th>BunchID</th><th>&Delta;</th><th>Sum</th><th>&Delta;</th><th>X</th><th>Y</th><th>I</th></tr>';
  for(let i=0;i<Math.min(rd.length,N);i++){
    const b=rd[i].batch;
    if(!b||!b.trig_id||!b.trig_id.length){h+='<tr><td>Ch'+(i+1)+'</td><td colspan="9">-</td></tr>';continue}
    const t=b.trig_id[cf],tp=cf>0?b.trig_id[cf-1]:null;
    const bu=b.bunch_id[cf],bp=cf>0?b.bunch_id[cf-1]:null;
    const s=b.sum[cf],sp=cf>0?b.sum[cf-1]:null;
    const x=b.x?b.x[cf]:null,y=b.y?b.y[cf]:null,ii=b.i?b.i[cf]:null;
    const dl=(a,b,e)=>{if(a==null||b==null)return["-",""];const d=a-b,cl=e!==undefined?(d===e?"ok":"fail"):"";return[(d>0?"+":"")+d.toLocaleString(),cl]}
    const td=dl(t,tp,1),bd=dl(bu,bp,10),sd=dl(s,sp);
    h+='<tr><td>Ch'+(i+1)+'</td>'
      +'<td class="val">'+(t!=null?t.toLocaleString():"-")+'</td><td class="del '+td[1]+'">'+td[0]+'</td>'
      +'<td class="val">'+(bu!=null?bu.toLocaleString():"-")+'</td><td class="del '+bd[1]+'">'+bd[0]+'</td>'
      +'<td class="val">'+(s!=null?s.toLocaleString():"-")+'</td><td class="del '+sd[1]+'">'+sd[0]+'</td>'
      +'<td>'+(x!=null?x.toFixed(4):"-")+'</td><td>'+(y!=null?y.toFixed(4):"-")+'</td><td>'+(ii!=null?ii.toFixed(4):"-")+'</td></tr>';
  }
  document.getElementById("ft").innerHTML=h;
}

function sendCmd(cmd,delay){
  const el=document.getElementById('ctrlStatus');
  fetch('/api/msg',{method:'POST',body:cmd}).then(r=>r.json()).then(j=>{el.textContent=cmd+(j.ok?' ✓':' ✗')}).catch(e=>{el.textContent=cmd+' ERR'});
  if(delay) return new Promise(r=>setTimeout(r,delay));
}

async function poll(){
  try{
    const r=await fetch('/api/data');
    const d=await r.json();
    const chs=d.channels||[];
    const a=chs[0]||{};
    document.getElementById('rcv').textContent=(a.frames||0).toLocaleString();
    document.getElementById('seq').textContent=(a.batches||0).toLocaleString();
    if(chs.length){
      rd=chs;
      const b0=chs[0].batch;
      const n=b0?b0.trig_id.length:0;
      document.getElementById("fm").textContent=n>0?n-1:0;
      document.getElementById("fs").max=n>0?n-1:0;
      document.getElementById("fn").max=n>0?n-1:0;
      cf=Math.min(cf,n-1);
    }
    for(let i=0;i<N;i++){
      const ch=chs.find(c=>c.ch===i+1);
      const b=ch&&ch.batch;
      if(b&&b.trig_id){
        cT.data.datasets[i].data=ds(b.trig_id,MC);
        cB.data.datasets[i].data=ds(b.bunch_id,MC);
        cS.data.datasets[i].data=ds(b.sum,MC);
      }
    }
    const b0=chs[0]&&chs[0].batch;
    if(b0&&b0.x){
      cXYI.data.datasets[0].data=ds(b0.x,MC);
      cXYI.data.datasets[1].data=ds(b0.y,MC);
      cXYI.data.datasets[2].data=ds(b0.i,MC);
    }
    cT.update("none");cB.update("none");cS.update("none");cXYI.update("none");
    upd();
  }catch(e){}
}
setInterval(poll,100);poll();
</script>
</body>
</html>
