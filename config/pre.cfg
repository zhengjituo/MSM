# MSM EPICS 前缀配置 —— 唯一真源
#
# 三处消费者都从这里取值：
#   1. st.cmd        : set -a; source pre.cfg; set +a; softIoc -m "P=$P,I=$I"
#   2. msm_epics     : 读取本文件（--prefix-cfg）或直接用环境变量 MSM_P/MSM_I
#   3. gen_db.py     : 生成 msm_pvs.db（默认保留宏，--hardcode 则固化）
#   4. pydm          : 启动脚本里用 --macro "P=$P,I=$I"
#
# 部署到不同装置时，只改这一个文件。

P=MSM:
I=
