<html>
<head>
<meta charset="utf-8">
<title>MSM DAQ 状态</title>
<meta http-equiv="refresh" content="2">
<style>
body { font-family: monospace; background: #1a1a2e; color: #eee; padding: 20px; }
h1 { color: #e94560; font-size: 18px; }
.state { display: inline-block; padding: 2px 12px; border-radius: 4px; font-weight: bold; font-size: 14px; }
.state-running { background: #2e7d32; color: #a5d6a7; }
.state-stopped { background: #616161; color: #bdbdbd; }
.state-error { background: #c62828; color: #ef9a9a; }
table { border-collapse: collapse; width: 100%; max-width: 900px; margin-top: 10px; }
th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid #333; font-size: 13px; }
th { color: #e94560; background: #16213e; }
td { color: #ccc; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
.ind-on { background: #4caf50; }
.ind-off { background: #f44336; }
.ind-idle { background: #ff9800; }
</style>
</head>
<body>
<h1>MSM DAQ 状态帧</h1>
<div id="content">加载中...</div>
<script>
async function refresh() {
    try {
        const r = await fetch('/api/status');
        const d = await r.json();
        let h = '';
        h += '<table><tr><th>模块</th><th>状态</th><th>总帧数</th><th>批次数</th><th>最后一帧</th></tr>';

        h += '<tr><td>DAQ</td>';
        if (d.daq_running) {
            h += '<td><span class="state state-running">● 采集中</span></td>';
            h += '<td class="num">' + d.total_frames.toLocaleString() + '</td>';
        } else {
            h += '<td><span class="state state-stopped">● 已停止</span></td>';
            h += '<td class="num">0</td>';
        }
        h += '<td class="num">—</td>';
        h += '<td class="num">—</td></tr>';

        let anyProc = false;
        for (let i = 0; i < d.channels.length; i++) {
            const ch = d.channels[i];
            h += '<tr><td>&nbsp;&nbsp;ch' + (i+1) + '</td>';
            h += '<td><span class="indicator ' + (ch.processed > 0 ? 'ind-on' : 'ind-off') + '"></span></td>';
            h += '<td class="num">' + ch.processed.toLocaleString() + '</td>';
            h += '<td class="num">' + ch.batches.toLocaleString() + '</td>';
            h += '<td class="num">trig=' + ch.last_trig_id + '&nbsp;bunch=' + ch.last_bunch_id + '</td></tr>';
            if (ch.processed > 0) anyProc = true;
        }

        h += '<tr><td>Process</td>';
        if (anyProc) {
            h += '<td><span class="state state-running">● 处理中</span></td>';
        } else if (d.daq_running) {
            h += '<td><span class="state state-idle">● 等待数据</span></td>';
        } else {
            h += '<td><span class="state state-stopped">● 已停止</span></td>';
        }
        h += '<td colspan="3"></td></tr>';

        h += '<tr><td>Storage</td>';
        if (d.storage_count > 0) {
            h += '<td><span class="state state-running">● 存盘中</span></td>';
            h += '<td class="num">' + d.storage_count.toLocaleString() + '</td>';
        } else {
            h += '<td><span class="state state-stopped">● 空闲</span></td>';
            h += '<td class="num">0</td>';
        }
        h += '<td colspan="2"></td></tr>';

        h += '</table>';
        document.getElementById('content').innerHTML = h;
    } catch (e) {
        document.getElementById('content').innerHTML = '<span style="color:#f44">连接失败: ' + e.message + '</span>';
    }
}
setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
