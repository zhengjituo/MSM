<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MSM DAQ Control</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
h1 { color: #00d4ff; margin-bottom: 20px; font-weight: 300; font-size: 24px; display: flex; align-items: center; gap: 16px; }
h2 { color: #00d4ff; font-size: 16px; font-weight: 500; margin-bottom: 12px; border-bottom: 1px solid #0f3460; padding-bottom: 8px; }
.group-box { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 16px; margin-bottom: 16px; display: inline-block; vertical-align: top; min-width: 300px; }
.row { display: flex; align-items: center; margin-bottom: 6px; }
.row label { width: 130px; color: #a0a0b0; font-size: 13px; flex-shrink: 0; }
.row .value { flex: 1; display: flex; gap: 6px; align-items: center; }
.ro-value { width: 100%; padding: 5px 8px; border-radius: 4px; font-size: 13px; background: #0a0a1a; border: 1px solid #1a3a5c; color: #4ae0a0; text-align: right; }
.indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
.indicator.on { background: #4ae0a0; box-shadow: 0 0 8px #4ae0a0; }
.indicator.off { background: #e04a4a; }
.btn { padding: 8px 20px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all .15s; }
.btn-start { background: #00d4ff; color: #1a1a2e; }
.btn-start:hover { background: #00b8e6; transform: scale(1.03); }
.btn-start:active { transform: scale(0.97); }
.btn-stop { background: #e04a4a; color: #fff; }
.btn-stop:hover { background: #cc3333; }
.btn-startall { background: #4ae0a0; color: #1a1a2e; }
.btn-stopall { background: #e04a4a; color: #fff; }
.control-bar { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
.control-bar .sep { width: 1px; background: #0f3460; margin: 0 4px; }
.status-bar { margin-top: 12px; font-size: 12px; color: #606080; display: flex; gap: 16px; align-items: center; }
#toast { position: fixed; bottom: 20px; right: 20px; background: #0a0a1a; border: 1px solid #00d4ff; border-radius: 6px; padding: 10px 16px; font-size: 13px; color: #00d4ff; opacity: 0; transition: opacity .3s; pointer-events: none; }
#toast.show { opacity: 1; }
</style>
</head>
<body>

<h1>MSM DAQ Control <span id="liveStatus" style="font-size:13px;color:#606080">starting...</span></h1>

<div id="groups"></div>

<div class="control-bar">
  <button class="btn btn-startall" onclick="startAll()">▶ Start All</button>
  <button class="btn btn-stopall"  onclick="stopAll()">■ Stop All</button>
  <div class="sep"></div>
  <button class="btn btn-start" onclick="send('SaveEnable >> ->| Storage','Save Enable')">💾 Save ON</button>
  <button class="btn btn-stop"  onclick="send('SaveDisable >> ->| Storage','Save Disable')">💾 Save OFF</button>
</div>

<div class="status-bar">
  <span id="statusText">Connecting...</span>
  <span id="updateTime"></span>
</div>
<div id="toast"></div>

<script>
const API = '/api';
const POLL_MS = 2000;
const outputs = {};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show';
  setTimeout(() => t.className = '', 2000);
}

async function send(niStr, label) {
  try {
    const r = await fetch('/api/msg', { method: 'POST', body: niStr });
    const j = await r.json();
    toast((label||'MSG') + ' → ' + j.status);
  } catch(e) {
    toast('FAILED: ' + (label||niStr));
  }
}

async function startAll() {
  toast('Starting Storage...');
  await send('Start >> ->| Storage','Storage');
  await new Promise(r => setTimeout(r, 200));
  toast('Starting Process...');
  await send('Start >> ->| Process','Process');
  await new Promise(r => setTimeout(r, 200));
  toast('Starting SimDAQ...');
  await send('Start >> ->| SimDAQ','SimDAQ');
  toast('All started');
}

async function stopAll() {
  await send('Stop >> ->| SimDAQ','SimDAQ');
  await new Promise(r => setTimeout(r, 100));
  await send('Stop >> ->| Process','Process');
  await new Promise(r => setTimeout(r, 600));
  await send('Stop >> ->| Storage','Storage');
  toast('All stopped');
}

function updateDisplay(mod, varName, val) {
  const el = outputs[mod + ':' + varName];
  if (!el) return;
  if (varName === 'running' || varName === 'recording' || varName === 'save_enabled') {
    el.className = 'indicator ' + (val !== '0' ? 'on' : 'off');
  } else {
    el.textContent = val;
    el.style.color = '#4ae0a0';
  }
}

async function pollAll() {
  const vars = [
    ['SimDAQ','trig_length'],['SimDAQ','trigger_rate_hz'],['SimDAQ','frames_per_cycle'],
    ['SimDAQ','running'],['SimDAQ','ch1_frames'],['SimDAQ','ch2_frames'],['SimDAQ','ch3_frames'],['SimDAQ','ch4_frames'],
    ['Process','running'],['Process','ch1_trig_id'],['Process','ch1_bunch_id'],
    ['Process','ch2_trig_id'],['Process','ch2_bunch_id'],
    ['Process','ch3_trig_id'],['Process','ch3_bunch_id'],
    ['Process','ch4_trig_id'],['Process','ch4_bunch_id'],
    ['Process','ch1_frames'],['Process','ch2_frames'],['Process','ch3_frames'],['Process','ch4_frames'],
    ['Storage','recording'],['Storage','save_enabled'],
    ['Storage','ch1_frames'],['Storage','ch2_frames'],['Storage','ch3_frames'],['Storage','ch4_frames'],
  ];
  let ok = 0, fail = 0;
  const results = await Promise.allSettled(vars.map(([m,v]) =>
    fetch(API + '/' + m + '/' + v).then(async r => {
      if (!r.ok) throw r.status;
      const j = await r.json();
      return j && j.ok !== undefined ? j.ok : '';
    })
  ));
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') {
      updateDisplay(vars[i][0], vars[i][1], r.value);
      ok++;
    } else {
      fail++;
    }
  });
  const el = document.getElementById('statusText');
  el.textContent = ok + '/' + (ok+fail) + ' PVs';
  el.style.color = fail === 0 ? '#4ae0a0' : '#f0a030';
  document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();
}

const LAYOUTS = {
  SimDAQ: [
    ['trig_length','io'],['trigger_rate_hz','io'],['frames_per_cycle','io'],
    ['running','o'],['ch1_frames','o'],['ch2_frames','o'],['ch3_frames','o'],['ch4_frames','o']
  ],
  Process: [
    ['running','o'],
    ['ch1_trig_id','o'],['ch1_bunch_id','o'],
    ['ch2_trig_id','o'],['ch2_bunch_id','o'],
    ['ch3_trig_id','o'],['ch3_bunch_id','o'],
    ['ch4_trig_id','o'],['ch4_bunch_id','o'],
    ['ch1_frames','o'],['ch2_frames','o'],['ch3_frames','o'],['ch4_frames','o']
  ],
  Storage: [
    ['recording','o'],['save_enabled','o'],
    ['ch1_frames','o'],['ch2_frames','o'],['ch3_frames','o'],['ch4_frames','o']
  ]
};

function buildUI() {
  const c = document.getElementById('groups');
  for (const [mod, vars] of Object.entries(LAYOUTS)) {
    const box = document.createElement('div'); box.className = 'group-box';
    let html = '<h2>' + mod + '</h2>';
    for (const [vn, dir] of vars) {
      const key = mod + ':' + vn;
      if (vn === 'running' || vn === 'recording' || vn === 'save_enabled') {
        html += '<div class="row"><label>' + vn + '</label><div class="value"><span class="indicator off" id="out_' + key + '"></span></div></div>';
      } else if (dir === 'o') {
        html += '<div class="row"><label>' + vn + '</label><div class="value"><span class="ro-value" id="out_' + key + '">-</span></div></div>';
      }
    }
    box.innerHTML = html;
    c.appendChild(box);
    for (const [vn, dir] of vars) {
      const key = mod + ':' + vn;
      outputs[key] = document.getElementById('out_' + key);
    }
  }
}

buildUI();
pollAll();
setInterval(pollAll, POLL_MS);
document.getElementById('liveStatus').textContent = 'polling every ' + (POLL_MS/1000) + 's';
</script>
</body>
</html>
