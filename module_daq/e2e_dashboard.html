<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MSM DAQ Control</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
h1 { color: #00d4ff; margin-bottom: 20px; font-weight: 300; font-size: 24px; }
.controls { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; }
button { padding: 10px 24px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
button.start { background: #00d4ff; color: #1a1a2e; }
button.stop { background: #e04a4a; color: #fff; }
button.toggle { background: #4ae0a0; color: #1a1a2e; }
button.toggle.off { background: #555; color: #aaa; }
button:active { opacity: .7; }
.status { font-size: 13px; color: #aaa; margin-left: 12px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.card { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 16px; }
.card h3 { color: #00d4ff; font-size: 14px; margin-bottom: 12px; border-bottom: 1px solid #0f3460; padding-bottom: 6px; }
.card .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
.card .row .label { color: #808090; }
.card .row .value { color: #4ae0a0; font-family: monospace; }
.summary { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 16px; }
.summary table { width: 100%; border-collapse: collapse; font-size: 13px; }
.summary th { color: #00d4ff; text-align: left; padding: 4px 8px; border-bottom: 1px solid #0f3460; }
.summary td { padding: 4px 8px; border-bottom: 1px solid #0a0a1a; font-family: monospace; }
.summary .row-id { background: #0a1a2e; }
</style>
</head>
<body>

<h1>MSM DAQ Control</h1>

<div class="controls">
  <button class="start" onclick="startAll()">Start All</button>
  <button class="stop" onclick="stopAll()">Stop All</button>
  <button class="toggle off" id="recBtn" onclick="toggleRec()">Recording: OFF</button>
  <span class="status" id="status">Idle</span>
</div>

<div class="grid" id="channelCards"></div>

<div class="summary" id="summaryTable">
  <table>
    <thead><tr><th>Ch</th><th>Frames</th><th>Batches</th><th>TrigID</th><th>BunchID</th><th>Saved</th><th>Overflow</th><th>FrameSz</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const API = "";
const POLL_MS = 1000;

async function apiPost(path, body) {
  try {
    await fetch(API + path, { method: "POST", body: String(body) });
  } catch(e) { console.error(e); }
}

function startAll() {
  document.getElementById("status").textContent = "Starting...";
  apiPost("/api/msg", "Start >> ->| Storage");
  setTimeout(() => apiPost("/api/msg", "Start >> ->| Process"), 300);
  setTimeout(() => apiPost("/api/msg", "Start >> ->| DAQModule"), 600);
  setTimeout(() => document.getElementById("status").textContent = "Running", 800);
}

function stopAll() {
  document.getElementById("status").textContent = "Stopping...";
  apiPost("/api/msg", "Stop >> ->| DAQModule");
  setTimeout(() => apiPost("/api/msg", "Stop >> ->| Process"), 300);
  setTimeout(() => apiPost("/api/msg", "Stop >> ->| Storage"), 600);
  setTimeout(() => document.getElementById("status").textContent = "Stopped", 800);
}

let recording = false;
function toggleRec() {
  recording = !recording;
  const btn = document.getElementById("recBtn");
  btn.textContent = recording ? "Recording: ON" : "Recording: OFF";
  btn.className = recording ? "toggle" : "toggle off";
  if (recording) {
    apiPost("/api/msg", "Start >> ->| Storage");
  } else {
    apiPost("/api/msg", "Stop >> ->| Storage");
  }
}

function render(data) {
  const chs = data.channels || [];
  // Channel cards
  const grid = document.getElementById("channelCards");
  grid.innerHTML = "";
  for (const ch of chs) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h3>Channel ${ch.ch}</h3>
      <div class="row"><span class="label">TrigID</span><span class="value">${ch.trig_id || 0}</span></div>
      <div class="row"><span class="label">BunchID</span><span class="value">${ch.bunch_id || 0}</span></div>
      <div class="row"><span class="label">Frames</span><span class="value">${ch.frames || 0}</span></div>
      <div class="row"><span class="label">Batches</span><span class="value">${ch.batches || 0}</span></div>
    `;
    grid.appendChild(card);
  }

  // Summary table
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  for (const ch of chs) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${ch.ch}</td>
      <td>${ch.frames || 0}</td>
      <td>${ch.batches || 0}</td>
      <td>${ch.trig_id || 0}</td>
      <td>${ch.bunch_id || 0}</td>
      <td>${ch.saved || 0}</td>
      <td>${ch.overflow || 0}</td>
      <td>${ch.frame_size || 0}</td>
    `;
    tbody.appendChild(tr);
  }

  document.getElementById("status").textContent =
    data.running ? "Running" : "Stopped";
}

async function poll() {
  try {
    const r = await fetch("/api/data");
    if (!r.ok) return;
    const data = await r.json();
    render(data);
  } catch(e) { /* wait */ }
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
