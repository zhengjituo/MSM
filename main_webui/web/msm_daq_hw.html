<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MSM DAQ</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; font-size: 14px; }
h1 { color: #00d4ff; font-size: 22px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
.indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
.indicator.on { background: #4ae0a0; box-shadow: 0 0 6px #4ae0a0; }
.indicator.off { background: #555; }
.indicator.warn { background: #f0a030; box-shadow: 0 0 6px #f0a030; }
.btn { padding: 6px 16px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
.btn-primary { background: #00d4ff; color: #111; }
.btn-danger { background: #e04a4a; color: #fff; }
.btn-warn { background: #f0a030; color: #111; }
.btn-default { background: #333; color: #ccc; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar label { color: #a0a0b0; font-size: 13px; }
.toolbar input[type=checkbox] { width: 16px; height: 16px; }
input.idx-input { width: 70px; padding: 4px 6px; border-radius: 4px; border: 1px solid #0f3460; background: #16213e; color: #e0e0e0; font-size: 13px; text-align: center; }
.mode-select { display: flex; gap: 6px; align-items: center; }
.mode-select label { color: #e0e0e0; padding: 3px 10px; border-radius: 4px; border: 1px solid #0f3460; cursor: pointer; font-size: 13px; }
.mode-select input[type=radio] { display: none; }
.mode-select input[type=radio]:checked + label { background: #00d4ff; color: #111; border-color: #00d4ff; font-weight: 600; }
.backend-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #a0a0b0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }
th, td { padding: 5px 10px; text-align: right; border-bottom: 1px solid #0f3460; font-variant-numeric: tabular-nums; }
th { color: #a0a0b0; font-weight: 500; text-align: center; background: #16213e; }
td { color: #4ae0a0; }
td:first-child, th:first-child { text-align: left; color: #e0e0e0; }
h2 { color: #00d4ff; font-size: 15px; margin: 14px 0 6px; }
hr { border: none; border-top: 1px solid #0f3460; margin: 14px 0; }
#statusBar { margin-top: 12px; font-size: 12px; color: #606080; display: flex; gap: 16px; align-items: center; }
#toast { position: fixed; bottom: 20px; right: 20px; background: #0a0a1a; border: 1px solid #00d4ff; border-radius: 6px; padding: 8px 14px; font-size: 12px; color: #00d4ff; opacity: 0; transition: opacity .3s; pointer-events: none; }
#toast.show { opacity: 1; }
tr.cardrow td { background: #0f3460; color: #7ab0ff; font-weight: 600; text-align: left; }
#featWrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 10px; align-items: start; }
.featCard { border: 1px solid #0f3460; border-radius: 6px; padding: 8px; }
.featCardTitle { font-size: 12px; color: #7ab0ff; font-weight: 600; margin-bottom: 4px; }
.featCard table { margin-bottom: 0; }
.cardWave { margin-bottom: 4px; }
.cardWaveTitle { font-size: 12px; color: #7ab0ff; font-weight: 600; margin: 4px 0; }
.waveTab { font-size: 12px; padding: 3px 10px; border: 1px solid #0f3460; border-radius: 4px; background: #16213e; color: #a0a0b0; cursor: pointer; }
.waveTab.active { background: #0f3460; color: #e0e0e0; border-color: #7ab0ff; }
.cardWaveGrid { display: grid; gap: 8px; }
</style>
</head>
<body>

<h1>
  MSM DAQ
  <span id="indDaq" class="indicator off"></span><span style="font-size:12px;color:#a0a0b0;margin-right:8px" id="lblDaq">DAQ</span>
  <span id="indSave" class="indicator off"></span><span style="font-size:12px;color:#a0a0b0;margin-right:8px" id="lblSave">Save</span>
  <span style="font-size:12px;color:#606080" id="fpsDisplay">0 fps</span>
</h1>

<!-- Backend control -->
<div class="toolbar" id="backendToolbar">
  <span class="mode-select">
    <input type="radio" name="backendMode" id="modeHw" value="hw" checked>
    <label for="modeHw">HW</label>
    <input type="radio" name="backendMode" id="modeSim" value="sim">
    <label for="modeSim">SIM</label>
  </span>
  <button class="btn btn-primary btn-sm" id="btnRun" onclick="doRun()">▶ Run</button>
  <button class="btn btn-danger btn-sm" id="btnQuitBackend" onclick="doQuitBackend()" disabled>■ Quit</button>
  <span class="backend-indicator">
    <span id="indBackend" class="indicator off"></span>
    <span id="backendStatusText">stopped</span>
  </span>
</div>

<!-- DAQ control -->
<div class="toolbar">
  <label><input type="checkbox" id="saveCheck" onchange="toggleSave()" disabled> Save</label>
  <label><input type="checkbox" id="waveCheck"> Waveform</label>
  <button class="btn btn-start" id="btnStart" onclick="doStart()" disabled>▶ Start</button>
  <button class="btn btn-stop" id="btnStop" onclick="doStop()" disabled>■ Stop</button>
  <button class="btn btn-default btn-sm" id="btnConfigPanel" onclick="toggleCfgPanel(true)">Config</button>
</div>

<h2>Frame Summary</h2>
<table>
  <!-- Consumed = storage 阶段消耗的帧数（不管是否落盘都计数），不叫 Storage 以免误解为已存盘 -->
  <thead><tr><th>Ch</th><th>DAQ</th><th>Process</th><th>Batches</th><th>Consumed</th><th title="ring 溢出丢批次数。&gt;0 = 消费速度跟不上生产，有数据丢失！">丢帧</th></tr></thead>
  <tbody id="chTable"></tbody>
</table>

<h2>Feature Table
  <span style="font-size:12px;color:#606080" id="featMeta"></span>
</h2>
<div class="toolbar">
  <label>Index:</label>
  <input class="idx-input" id="idxInput" type="number" min="-1" max="9999" value="-1" title="-1 = 自动对齐：批内扫描选 bunch_id 最接近 100000 边界的帧（整 100ms 时刻）">
  <button class="btn btn-reload" onclick="setFrameIndex()" style="padding:4px 10px;font-size:12px">Set</button>
</div>
<div id="featWrap"></div>

<div id="waveSection" style="display:none">
  <h2>Waveform <span style="font-size:12px;color:#606080" id="waveMeta"></span></h2>
  <div id="waveTabs" style="display:none; gap:6px; margin-bottom:6px; flex-wrap:wrap"></div>
  <div id="waveGrid" style="display:grid;grid-template-columns:1fr;gap:8px"></div>
</div>

<div id="statusBar">
  <span id="statusText">connecting...</span>
  <span id="startErr" style="color:#e04a4a"></span>
  <span id="chCount"></span>
  <span id="updateTime"></span>
</div>
<div class="panel" id="configPanel" style="display:none; border:1px solid #0f3460; border-radius:8px; padding:14px; margin-top:12px;">
  <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
    <span style="font-weight:600;">Config</span>
    <span id="cfgVersion" style="color:#a0a0b0; font-size:12px;"></span>
    <span id="cfgScanned" style="color:#7ab0ff; font-size:12px;"></span>
    <button class="btn btn-primary btn-sm" onclick="cfgSave('channel')">保存当前通道</button>
    <button class="btn btn-primary btn-sm" onclick="cfgSave('card')">保存本卡全部通道</button>
    <button class="btn btn-primary btn-sm" onclick="cfgSave('chassis')">保存机箱全部 1073 通道</button>
    <button class="btn btn-default btn-sm" onclick="cfgCardAddShow()">＋ 新增板卡</button>
    <button class="btn btn-danger btn-sm" onclick="cfgCardRemove()">－ 删除所选板卡</button>
    <span style="color:#606080; font-size:11px;">增删板卡写入待使用配置，下次 Run（后端重启）生效</span>
    <button class="btn btn-default btn-sm" onclick="toggleCfgPanel(false)">关闭</button>
  </div>
  <div id="cfgAddCardRow" style="display:none; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; padding:8px 10px; border:1px dashed #0f3460; border-radius:6px;">
    <span style="font-size:12px; color:#a0a0b0; font-weight:600;">新增板卡</span>
    <select id="cfgAddType" onchange="cfgAddCardRefreshSlots()" style="background:#16213e; color:#e0e0e0; border:1px solid #0f3460; border-radius:4px; padding:3px 6px; font-size:12px;"></select>
    <select id="cfgAddSlot" onchange="document.getElementById('cfgAddSlotManual').style.display='none'" style="background:#16213e; color:#e0e0e0; border:1px solid #0f3460; border-radius:4px; padding:3px 6px; font-size:12px;"></select>
    <input id="cfgAddSlotManual" type="number" min="1" max="64" placeholder="手动填 slot" style="width:100px; display:none; background:#16213e; color:#e0e0e0; border:1px solid #0f3460; border-radius:4px; padding:3px 6px; font-size:12px;">
    <select id="cfgAddCloneFrom" style="background:#16213e; color:#e0e0e0; border:1px solid #0f3460; border-radius:4px; padding:3px 6px; font-size:12px;"></select>
    <span id="cfgAddHint" style="color:#606080; font-size:11px;"></span>
    <button class="btn btn-primary btn-sm" onclick="cfgCardAddDo()">确认新增</button>
    <button class="btn btn-default btn-sm" onclick="cfgCardAddShow(false)">取消</button>
  </div>
  <div id="cfgBody" style="display:grid; grid-template-columns:220px 1fr; gap:12px;">
    <div>
      <select id="cfgSelCard" class="cfg-sel" onchange="cfgPopulateChannels()" style="width:100%; background:#16213e; color:#e0e0e0; border:1px solid #0f3460; border-radius:4px; padding:4px 8px; font-size:13px;"></select>
      <select id="cfgSelChannel" class="cfg-sel" onchange="cfgRenderParams()" style="width:100%; margin-top:6px; background:#16213e; color:#e0e0e0; border:1px solid #0f3460; border-radius:4px; padding:4px 8px; font-size:13px;"></select>
      <label style="display:flex; gap:6px; align-items:center; margin-top:8px; font-size:13px;">
        <input type="checkbox" id="cfgRunEnable"> runEnable
      </label>
    </div>
    <div id="cfgParamGrid" style="display:grid; grid-template-columns:repeat(2,1fr); gap:6px;"></div>
  </div>
  <div id="cfgApp" style="margin-top:10px; border-top:1px solid #0f3460; padding-top:8px;">
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px;">
      <span style="font-weight:600; font-size:12px; color:#a0a0b0;">app_config</span>
      <button class="btn btn-primary btn-sm" id="btnCfgSaveApp" onclick="cfgSaveApp()">保存软件参数</button>
    </div>
    <div id="cfgAppGrid" style="display:grid; grid-template-columns:repeat(3,1fr); gap:6px;"></div>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';

let evtSource = null;
let prevFrames = [];
let prevTime = Date.now();

const FEATURE_LABELS = [
  ["trig_id", "TrigID"],
  ["bunch_id", "BunchID"],
  ["min", "Min"],
  ["max", "Max"],
  ["sum_l", "Sum_L"],
  ["sum_h", "Sum_H"],
  ["vpp", "Vpp"],
  ["x", "X"],
  ["y", "Y"],
  ["i", "I"]
];

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show';
  setTimeout(() => t.className = '', 2000);
}

async function post(url, body) {
  try {
    const r = await fetch(url, { method:'POST', body });
    const j = await r.json();
    toast(j.status);
    return j;
  } catch(e) {
    toast('FAILED');
    return { status: 'FAILED' };
  }
}

function connectSSE() {
  if (evtSource) evtSource.close();
  evtSource = new EventSource('/api/events');
  evtSource.onmessage = function(e) {
    try {
      const d = JSON.parse(e.data);
      render(d);
    } catch(e) { /* ignore parse errors */ }
  };
  evtSource.onerror = function() {
    document.getElementById('statusText').textContent = 'disconnected';
    setTimeout(connectSSE, 2000);
  };
}

function render(d) {
  const now = Date.now();
  document.getElementById('indDaq').className = 'indicator ' + (d.running ? 'on' : 'off');
  document.getElementById('lblDaq').textContent = d.running ? 'Run' : 'Stop';
  document.getElementById('indSave').className = 'indicator ' + (d.save_enabled ? 'on' : 'off');
  document.getElementById('lblSave').textContent = d.save_enabled ? 'On' : 'Off';

  const backendAlive = d.backend_alive;
  const backendSt = d.backend_status || 'stopped';
  const backendRunning = backendAlive && backendSt === 'running';

  // Backend indicator
  const indB = document.getElementById('indBackend');
  if (backendSt === 'running') {
    indB.className = 'indicator on';
  } else if (backendSt === 'launching') {
    indB.className = 'indicator warn';
  } else if (backendSt === 'crashed') {
    indB.className = 'indicator off';
    indB.style.background = '#e04a4a';
    indB.style.boxShadow = '0 0 6px #e04a4a';
  } else {
    indB.className = 'indicator off';
    indB.style.background = '';
    indB.style.boxShadow = '';
  }
  document.getElementById('backendStatusText').textContent = backendSt;

  // Backend buttons
  document.getElementById('btnRun').disabled = backendRunning || backendSt === 'launching';
  document.getElementById('btnQuitBackend').disabled = !backendAlive && backendSt !== 'crashed';

  // DAQ controls enabled only when backend is running
  document.getElementById('saveCheck').disabled = !backendRunning;
  document.getElementById('btnStart').disabled = !backendRunning || d.running;
  document.getElementById('btnStop').disabled = !backendRunning || !d.running;

  document.getElementById('saveCheck').checked = d.save_enabled;

  // 机箱扫描摘要（配置面板参考）+ 最近一次 Start 失败原因
  const sc = document.getElementById('cfgScanned');
  if (sc) {
    sc.textContent = d.scanned_1073_slots
      ? '机箱扫描: 1073 slots [' + d.scanned_1073_slots + ']'
        + (d.scanned_3010_slot >= 0 ? ' · 3010 slot ' + d.scanned_3010_slot : ' · 3010 无')
      : '';
  }
  // 机箱扫描结果缓存（供「新增板卡」按扫描选 slot）
  lastBackendAlive = !!d.backend_alive;
  if (typeof d.scanned_1073_slots === 'string' && d.scanned_1073_slots)
    lastScan1073 = d.scanned_1073_slots.split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n));
  if (typeof d.scanned_3010_slot === 'number') lastScan3010 = d.scanned_3010_slot;
  const se = document.getElementById('startErr');
  if (se) se.textContent = d.last_start_error ? ('启动失败: ' + d.last_start_error) : '';

  // 通道数/卡槽布局变化 → 波形网格按卡跟随（4/8/12/16）
  lastChannelCount = (d.channels || []).length || lastChannelCount;
  lastSlots = (d.channels || []).map(c => (c.slot === undefined ? -1 : c.slot));
  if (document.getElementById('waveSection').style.display !== 'none'
      && lastSlots.length > 0
      && (lastWaveSig !== lastSlots.join(',') || charts.length !== lastSlots.length)) {
    ensureCharts(lastSlots);
  }

  // Channel summary（多卡时按卡分组，带卡槽表头行）
  const tbody = document.getElementById('chTable');
  const chs = d.channels || [];
  let html = '';
  let i = 0, cardNo = 0;
  while (i < chs.length) {
    const slot = chs[i].slot;
    const grouped = (slot !== undefined && slot >= 0);
    let j = i;
    if (grouped) {
      while (j < chs.length && chs[j].slot === slot) j++;
      cardNo++;
      html += '<tr class="cardrow"><td colspan="6">Card#' + cardNo + ' · slot ' + slot + '</td></tr>';
    } else {
      j = chs.length;
    }
    for (let k = i; k < j; k++) {
      const ch = chs[k];
      html += '<tr><td>CH' + (k+1) + '</td>'
           + '<td>' + (ch.daq_frames || 0).toLocaleString() + '</td>'
           + '<td>' + (ch.proc_frames || 0).toLocaleString() + '</td>'
           + '<td>' + (ch.proc_batches || 0).toLocaleString() + '</td>'
           + '<td>' + (ch.consumed_frames || 0).toLocaleString() + '</td>'
           + '<td' + ((ch.overflow || 0) > 0
               ? ' style="color:#ff5252;font-weight:bold"' : ' style="color:#777"')
           + '>' + (ch.overflow || 0).toLocaleString() + '</td></tr>';
    }
    i = j;
  }
  tbody.innerHTML = html;

  // FPS
  const dt = (now - prevTime) / 1000;
  if (dt > 0 && prevFrames.length > 0 && d.channels) {
    const curFrames = d.channels.map(c => c.daq_frames || 0);
    const prevSum = prevFrames.reduce((a,b)=>a+b, 0);
    const curSum = curFrames.reduce((a,b)=>a+b, 0);
    const fps = (curSum - prevSum) / dt;
    document.getElementById('fpsDisplay').textContent = fps.toFixed(0) + ' fps';
    prevFrames = curFrames;
  } else if (d.channels) {
    prevFrames = d.channels.map(c => c.daq_frames || 0);
  }
  prevTime = now;

  // Feature table
  document.getElementById('featMeta').textContent =
    d.has_feature ? 'batch #' + d.batch_no + '  idx=' + d.frame_index : '';

  const feat = d.features || [];
  const nCh = feat.length;
  const chs2 = d.channels || [];
  const wrap = document.getElementById('featWrap');
  let fhtml = '';
  if (d.has_feature && nCh > 0) {
    // 每张卡一张小表（Feature × 该卡 4 通道），多卡横向铺开
    let i = 0, cardNo = 0;
    while (i < nCh) {
      const slot = chs2[i] ? chs2[i].slot : -1;
      const grouped = (slot !== undefined && slot >= 0);
      let j = i;
      if (grouped) {
        while (j < nCh && chs2[j] && chs2[j].slot === slot) j++;
      } else {
        j = nCh;
      }
      cardNo++;
      fhtml += '<div class="featCard"><div class="featCardTitle">Card#' + cardNo
             + (grouped ? ' · slot ' + slot : '') + '</div><table>';
      let hh = '<tr><th>Feature</th>';
      for (let k = i; k < j; k++) hh += '<th>CH' + (k+1) + '</th>';
      let bb = '</tr>';
      for (const [key, label] of FEATURE_LABELS) {
        bb += '<tr><td>' + label + '</td>';
        for (let k = i; k < j; k++) {
          let v = feat[k][key];
          if (key === 'bunch_id') {
            bb += '<td>' + v.toLocaleString() + '</td>';
          } else if (key === 'trig_id') {
            bb += '<td>' + v + '</td>';
          } else {
            let num = parseFloat(v);
            bb += '<td>' + (isNaN(num) ? v : num.toFixed(6)) + '</td>';
          }
        }
        bb += '</tr>';
      }
      fhtml += '<thead>' + hh + '</thead><tbody>' + bb + '</tbody></table></div>';
      i = j;
    }
  } else {
    fhtml = '<div class="featCard"><table><tr><td style="text-align:center;color:#606080">waiting for batch data...</td></tr></table></div>';
  }
  wrap.innerHTML = fhtml;

  document.getElementById('statusText').textContent = d.running ? 'running' : 'stopped';
  document.getElementById('statusText').style.color = d.running ? '#4ae0a0' : '#e04a4a';
  document.getElementById('chCount').textContent = (d.channels || []).length + 'ch';
  document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();
}

function doRun() {
  const mode = document.querySelector('input[name=backendMode]:checked').value;
  post('/api/run', mode);
}

function doQuitBackend() {
  if (confirm('Quit backend process?'))
    post('/api/stop', '');
}

function doStart() { post('/api/msg', 'start'); }
function doStop() { post('/api/msg', 'stop'); }

let CFG_META = { keys: [], enums: {}, cards: {}, version: '', pendingFile: '', runtimeFile: '', initFile: '' };
let CFG = null;
let lastScan1073 = [];    // 机箱扫描到的 1073 slot（后端未启动/未采集过为空）
let lastScan3010 = -1;    // 机箱扫描到的 3010 slot
let lastBackendAlive = false;

async function fetchJSON(url, opts) {
  const r = await fetch(url, opts);
  let j = {};
  try { j = await r.json(); } catch(e) {}
  return { r, j };
}

async function cfgLoadMeta() {
  const { j } = await fetchJSON('/api/config/meta');
  CFG_META = Object.assign(CFG_META, j);
  document.getElementById('cfgVersion').textContent = '版本 ' + CFG_META.version;
}

async function cfgLoad() {
  const { r, j } = await fetchJSON('/api/config');
  if (!r.ok) { toast('配置加载失败'); return; }
  CFG = j;
  cfgPopulateCards();
  cfgRenderApp();
}

function toggleCfgPanel(show) {
  const p = document.getElementById('configPanel');
  p.style.display = show ? 'block' : 'none';
  if (show && !CFG) { cfgLoadMeta().then(() => cfgLoad()); }
}

function cfgCurrentCard() {
  const name = document.getElementById('cfgSelCard').value;
  return (CFG && CFG.DaqParameter && CFG.DaqParameter.Cards && CFG.DaqParameter.Cards[name]) || null;
}

function cfgPopulateCards() {
  const cards = (CFG && CFG.DaqParameter && CFG.DaqParameter.Cards) || {};
  const sel = document.getElementById('cfgSelCard');
  sel.innerHTML = '';
  for (const name in cards) {
    const c = cards[name];
    const label = (CFG_META.cards && CFG_META.cards[c.CardType]) || c.CardType;
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name + ' [' + label + '] (Slot ' + c.Slot + ')';
    sel.appendChild(opt);
  }
  cfgPopulateChannels();
}

function cfgPopulateChannels() {
  const card = cfgCurrentCard();
  const sel = document.getElementById('cfgSelChannel');
  sel.innerHTML = '';
  const chs = (card && card.Channels) || {};
  for (const key in chs) {
    if (!chs[key] || typeof chs[key] !== 'object') continue;
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = key + (chs[key].runEnable ? ' ●' : ' ○');
    sel.appendChild(opt);
  }
  cfgRenderParams();
}

function cfgCurrentChannel() {
  const chs = (cfgCurrentCard() || {}).Channels || {};
  const key = document.getElementById('cfgSelChannel').value;
  return key ? chs[key] : null;
}

function cfgRenderParams() {
  const ch = cfgCurrentChannel();
  const grid = document.getElementById('cfgParamGrid');
  grid.innerHTML = '';
  document.getElementById('cfgRunEnable').checked = !!ch && !!ch.runEnable;
  if (!ch) { grid.innerHTML = '<div style="color:#a0a0b0">无可编辑通道</div>'; return; }
  for (const key of CFG_META.keys) {
    if (key === 'cardIndex' || key === 'channel' || key === 'slot' || key === 'runEnable') continue;
    if (ch[key] === undefined) continue;
    grid.appendChild(cfgField(key, ch[key]));
  }
}

function cfgField(key, value) {
  const wrap = document.createElement('div');
  wrap.style.display = 'flex';
  wrap.style.flexDirection = 'column';
  wrap.style.gap = '2px';
  const lb = document.createElement('label');
  lb.textContent = key;
  lb.style.fontSize = '11px';
  lb.style.color = '#a0a0b0';
  let input;
  const opts = CFG_META.enums && CFG_META.enums[key];
  if (opts) {
    input = document.createElement('select');
    for (const o of opts) {
      const op = document.createElement('option');
      op.value = o; op.textContent = o;
      input.appendChild(op);
    }
    input.value = String(value);
  } else {
    const numeric = typeof value === 'number' || /^-?\d+(\.\d+)?$/.test(String(value));
    input = document.createElement('input');
    input.type = numeric ? 'number' : 'text';
    input.step = 'any';
    input.value = String(value);
  }
  input.dataset.key = key;
  input.style.width = '100%';
  input.style.background = '#16213e';
  input.style.color = '#e0e0e0';
  input.style.border = '1px solid #0f3460';
  input.style.borderRadius = '4px';
  input.style.padding = '3px 6px';
  input.style.fontSize = '12px';
  wrap.appendChild(lb);
  wrap.appendChild(input);
  return wrap;
}

function cfgRenderApp() {
  const grid = document.getElementById('cfgAppGrid');
  grid.innerHTML = '';
  const app = (CFG && CFG.app_config) || {};
  for (const k in app) {
    if (k === 'ConfigVersion') continue;
    const wrap = document.createElement('div');
    wrap.style.display = 'flex';
    wrap.style.flexDirection = 'column';
    wrap.style.gap = '2px';
    const lb = document.createElement('label');
    lb.textContent = k;
    lb.style.fontSize = '11px';
    lb.style.color = '#a0a0b0';
    const val = app[k];
    let input;
    if (typeof val === 'boolean') {
      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = val;
      input.dataset.jtype = 'bool';
    } else if (typeof val === 'number' || (typeof val === 'string' && /^-?\d+(\.\d+)?$/.test(val))) {
      input = document.createElement('input');
      input.type = 'number';
      input.step = 'any';
      input.value = String(val);
      input.dataset.jtype = 'number';
    } else {
      input = document.createElement('input');
      input.type = 'text';
      input.value = String(val);
      input.dataset.jtype = 'string';
    }
    input.dataset.key = k;
    input.style.width = '100%';
    input.style.background = '#16213e';
    input.style.color = '#e0e0e0';
    input.style.border = '1px solid #0f3460';
    input.style.borderRadius = '4px';
    input.style.padding = '3px 6px';
    input.style.fontSize = '12px';
    wrap.appendChild(lb);
    wrap.appendChild(input);
    grid.appendChild(wrap);
  }
}

async function cfgSaveApp() {
  const ac = {};
  document.querySelectorAll('#cfgAppGrid input[data-key]').forEach(el => {
    const jt = el.dataset.jtype;
    if (jt === 'bool') ac[el.dataset.key] = el.checked;
    else if (jt === 'number') ac[el.dataset.key] = parseFloat(el.value) || 0;
    else ac[el.dataset.key] = el.value;
  });
  const { j } = await fetchJSON('/api/config/save-app', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ app_config: ac }) });
  if (j.status === 'ok') { toast('软件参数已保存在待使用配置（下次启动生效）'); cfgLoad(); }
  else toast('保存失败: ' + (j.status || 'error'));
}

function cfgCollectParams() {
  const params = {};
  document.querySelectorAll('#cfgParamGrid input[data-key], #cfgParamGrid select[data-key]').forEach(el => {
    params[el.dataset.key] = el.value;
  });
  params.runEnable = document.getElementById('cfgRunEnable').checked ? 'true' : 'false';
  return params;
}

async function cfgSave(scope) {
  const card = cfgCurrentCard();
  if (!card) { toast('请先选择板卡'); return; }
  const key = document.getElementById('cfgSelChannel').value;
  const channel = key ? parseInt(key.replace('Channel#', ''), 10) : 0;
  const body = { scope, cardIndex: card.CardIndex, channel, params: cfgCollectParams() };
  const { r, j } = await fetchJSON('/api/config/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (j.status === 'ok') { toast('已保存到待使用配置，下次启动生效'); cfgLoad(); }
  else toast('保存失败: ' + (j.status || r.status));
}

// ── 板卡增删（按机箱扫描结果；写入待使用配置，下次 Run 生效）──
function cfgCardList() {
  const cards = (CFG && CFG.DaqParameter && CFG.DaqParameter.Cards) || {};
  const list = [];
  for (const name in cards) list.push({ name, ...cards[name] });
  return list;
}

function cfgCardAddShow(show) {
  const row = document.getElementById('cfgAddCardRow');
  row.style.display = (show === false) ? 'none' : 'flex';
  if (show === false) return;
  const list = cfgCardList();
  const has3010 = list.some(c => c.CardType === '3010');
  // 类型：1073 恒可选；3010 仅在未配置时可选
  const typeSel = document.getElementById('cfgAddType');
  typeSel.innerHTML = '<option value="1073">1073 数字化板卡</option>';
  if (!has3010) {
    const s3010 = document.createElement('option');
    s3010.value = '3010';
    s3010.textContent = '3010 时钟同步卡' + (lastScan3010 >= 0 ? '（扫描到 slot ' + lastScan3010 + '）' : '');
    typeSel.appendChild(s3010);
  }
  // 克隆源：已有 1073（新卡通道参数深拷贝自它）
  const cloneSel = document.getElementById('cfgAddCloneFrom');
  cloneSel.innerHTML = '';
  const c1073 = list.filter(c => c.CardType === '1073');
  if (c1073.length) {
    cloneSel.style.display = '';
    let lb = document.getElementById('cfgAddCloneLb');
    if (!lb) {
      lb = document.createElement('span');
      lb.id = 'cfgAddCloneLb';
      lb.textContent = '通道参数克隆自:';
      lb.style.cssText = 'font-size:12px;color:#a0a0b0';
      cloneSel.parentElement.insertBefore(lb, cloneSel);
    }
    for (const c of c1073) {
      const op = document.createElement('option');
      op.value = String(c.CardIndex);
      op.textContent = c.name + ' (slot ' + c.Slot + ')';
      cloneSel.appendChild(op);
    }
  } else {
    cloneSel.style.display = 'none';
    const lb = document.getElementById('cfgAddCloneLb');
    if (lb) lb.remove();
  }
  cfgAddCardRefreshSlots();
}

function cfgAddCardRefreshSlots() {
  const type = document.getElementById('cfgAddType').value;
  const sel = document.getElementById('cfgAddSlot');
  const manual = document.getElementById('cfgAddSlotManual');
  const hint = document.getElementById('cfgAddHint');
  sel.innerHTML = '';
  const configured = cfgCardList().map(c => c.Slot);
  let cands = [];
  if (type === '1073') {
    cands = lastScan1073.filter(s => !configured.includes(s));
  } else {
    cands = (lastScan3010 >= 0 && !configured.includes(lastScan3010)) ? [lastScan3010] : [];
  }
  if (cands.length) {
    for (const s of cands) {
      const op = document.createElement('option');
      op.value = String(s);
      op.textContent = 'slot ' + s;
      sel.appendChild(op);
    }
    sel.style.display = '';
    manual.style.display = 'none';
    hint.textContent = '（来自机箱扫描，未配置的空位）';
  } else {
    sel.style.display = 'none';
    manual.style.display = '';
    hint.textContent = lastBackendAlive
      ? '（扫描结果中没有未配置的空位，可手动输入 slot）'
      : '（后端未启动、无扫描结果，请手动输入 slot）';
  }
}

async function cfgCardAddDo() {
  const type = document.getElementById('cfgAddType').value;
  const sel = document.getElementById('cfgAddSlot');
  const manual = document.getElementById('cfgAddSlotManual');
  const slot = sel.style.display === 'none' ? parseInt(manual.value, 10) : parseInt(sel.value, 10);
  if (!slot || slot <= 0) { toast('请选择或输入有效的 slot'); return; }
  const params = { slot: String(slot), cardType: type };
  if (type === '1073') {
    const cf = document.getElementById('cfgAddCloneFrom');
    if (cf.style.display !== 'none' && cf.value) params.cloneFrom = cf.value;
  }
  const body = { scope: 'add-card', cardIndex: 0, channel: 0, params };
  const { r, j } = await fetchJSON('/api/config/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (j.status === 'ok') { toast('已新增 ' + type + ' slot ' + slot + '（下次 Run 生效）'); cfgCardAddShow(false); cfgLoad(); }
  else toast('新增失败: ' + (j.status || r.status));
}

async function cfgCardRemove() {
  const card = cfgCurrentCard();
  if (!card) { toast('请先在左侧选择要删除的板卡'); return; }
  const name = document.getElementById('cfgSelCard').value;
  const n1073 = cfgCardList().filter(c => c.CardType === '1073').length;
  let warn = '删除 ' + name + '（slot ' + card.Slot + '）？\n删除后下次 Run 不再打开该卡。';
  if (card.CardType === '1073' && n1073 <= 1)
    warn = '这是最后一张 1073 卡，删除后配置将没有采集通道！\n\n' + warn;
  if (card.CardType === '3010')
    warn = '删除 3010 后多卡全局同步触发将不可用！\n\n' + warn;
  if (!confirm(warn)) return;
  const body = { scope: 'remove-card', cardIndex: card.CardIndex, channel: 0, params: {} };
  const { r, j } = await fetchJSON('/api/config/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (j.status === 'ok') { toast('已删除 ' + name + '（下次 Run 生效）'); cfgLoad(); }
  else toast('删除失败: ' + (j.status || r.status));
}

function toggleSave() {
  const cb = document.getElementById('saveCheck');
  post('/api/msg', cb.checked ? 'enablesave' : 'disablesave');
}

function setFrameIndex() {
  const v = document.getElementById('idxInput').value;
  post('/api/msg', 'SetFrameIndex >> index=' + v + ' -@ Process');
}

// Waveform
let waveTimer = null;
const POW20 = 1048576.0;
const FFFF = 65535.0;
const charts = [];
let lastChannelCount = 0;
let lastSlots = [];       // 每通道的卡槽（来自 SSE channels[].slot）
let lastWaveSig = '';     // slot 签名，变化则按卡重建
const CHART_COLORS = ['#4ae0a0', '#f0a030', '#e04a4a', '#00d4ff'];

let waveCards = [];       // [{slot, cardNo, i0, i1, sec}]，按卡分节记录
let activeWaveTab = 0;    // 当前显示的卡 tab（多卡时一次只显示一张卡）

// 按卡动态建/删波形图：每卡一个分节（标题 Card#N · slot X + 该卡通道 2×2）
function ensureCharts(chanSlots) {
  const n = chanSlots.length;
  if (!n) return;
  const grid = document.getElementById('waveGrid');
  if (!grid) return;
  const sig = chanSlots.join(',');
  if (charts.length === n && document.getElementById('chart0') && lastWaveSig === sig) {
    for (let i = 0; i < n; i++) {
      charts[i] = charts[i] || initChart('chart' + i, i);
      charts[i] && charts[i].resize();
    }
    return;
  }
  lastWaveSig = sig;
  for (let i = 0; i < charts.length; i++) {
    if (charts[i]) { charts[i].dispose(); charts[i] = null; }
  }
  charts.length = n;
  grid.innerHTML = '';
  waveCards = [];
  let i = 0, cardNo = 0;
  while (i < n) {
    cardNo++;
    const slot = chanSlots[i];
    let j = i;
    if (slot >= 0) {
      while (j < n && chanSlots[j] === slot) j++;
    } else {
      j = n;   // 无 slot 信息（sim/旧后端）→ 整体一个分节
    }
    const nCh = j - i;
    const sec = document.createElement('div');
    sec.className = 'cardWave';
    const title = document.createElement('div');
    title.className = 'cardWaveTitle';
    title.textContent = 'Card#' + cardNo + (slot >= 0 ? ' · slot ' + slot : '');
    const cGrid = document.createElement('div');
    cGrid.className = 'cardWaveGrid';
    cGrid.style.gridTemplateColumns = 'repeat(' + Math.min(nCh, 2) + ',1fr)';
    for (let k = i; k < j; k++) {
      const el = document.createElement('div');
      el.id = 'chart' + k;
      el.style.cssText = 'height:180px;width:100%;min-width:0';
      cGrid.appendChild(el);
    }
    sec.appendChild(title);
    sec.appendChild(cGrid);
    grid.appendChild(sec);
    waveCards.push({ slot: slot, cardNo: cardNo, i0: i, i1: j, sec: sec });
    i = j;
  }
  buildWaveTabs();
  if (activeWaveTab >= waveCards.length) activeWaveTab = 0;
  applyWaveTabs();
  requestAnimationFrame(() => {
    for (let i = 0; i < n; i++) {
      charts[i] = charts[i] || initChart('chart' + i, i);
      charts[i] && charts[i].resize();
    }
  });
}

// 多卡 → tab 栏（一次只显示一张卡）；单卡/无 slot（sim）不显示
function buildWaveTabs() {
  const bar = document.getElementById('waveTabs');
  if (!bar) return;
  bar.innerHTML = '';
  if (waveCards.length < 2) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  waveCards.forEach((c, ti) => {
    const b = document.createElement('button');
    b.className = 'waveTab';
    b.textContent = 'Card#' + c.cardNo + (c.slot >= 0 ? ' · slot ' + c.slot : '');
    b.onclick = () => { activeWaveTab = ti; applyWaveTabs(); };
    bar.appendChild(b);
  });
}

function applyWaveTabs() {
  if (!waveCards.length) return;
  waveCards.forEach((c, ti) => { c.sec.style.display = (ti === activeWaveTab) ? '' : 'none'; });
  const bar = document.getElementById('waveTabs');
  if (bar) {
    bar.querySelectorAll('.waveTab').forEach((b, ti) => b.classList.toggle('active', ti === activeWaveTab));
  }
  // 切到的卡容器由隐藏变可见，canvas 需重新排版
  requestAnimationFrame(() => {
    const c = waveCards[activeWaveTab];
    if (!c) return;
    for (let i = c.i0; i < c.i1; i++)
      charts[i] && charts[i].resize();
  });
}


function initChart(divId, chIdx) {
  const el = document.getElementById(divId);
  if (!el) return null;
  const ch = echarts.init(el, null, { renderer: 'canvas' });
  ch.setOption({
    backgroundColor: '#0f3460',
    grid: { left: 50, right: 16, top: 24, bottom: 28 },
    title: { text: 'CH' + (chIdx + 1), textStyle: { color: '#a0a0b0', fontSize: 12 }, left: 4, top: 2 },
    xAxis: {
      type: 'value', name: 'Point', nameTextStyle: { color: '#606080', fontSize: 10 },
      axisLabel: { color: '#808090', fontSize: 10 },
      axisLine: { lineStyle: { color: '#0f3460' } },
      splitLine: { lineStyle: { color: '#1a3a5c' } }
    },
    yAxis: {
      type: 'value', name: 'mV', nameTextStyle: { color: '#606080', fontSize: 10 },
      axisLabel: { color: '#808090', fontSize: 10 },
      axisLine: { lineStyle: { color: '#0f3460' } },
      splitLine: { lineStyle: { color: '#1a3a5c' } }
    },
    dataZoom: [
      { type: 'inside', xAxisIndex: 0, filterMode: 'none' },
      { type: 'inside', yAxisIndex: 0, filterMode: 'none' }
    ],
    tooltip: { trigger: 'axis', textStyle: { fontSize: 11 } },
    series: [{
      type: 'line',
      data: [],
      symbol: 'none',
      lineStyle: { width: 1.5, color: CHART_COLORS[chIdx % 4] }
    }]
  });
  return ch;
}

function base64ToUint16LE(b64) {
  const bin = atob(b64);
  const n = bin.length >> 1;
  const a = new Uint16Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 2)
    a[i] = bin.charCodeAt(j) | (bin.charCodeAt(j + 1) << 8);
  return a;
}

document.getElementById('waveCheck').addEventListener('change', function() {
  const on = this.checked;
  document.getElementById('waveSection').style.display = on ? 'block' : 'none';
  if (on) {
    ensureCharts(lastSlots.length ? lastSlots : [-1, -1, -1, -1]);
    if (!waveTimer) {
      waveTimer = setInterval(fetchWaveform, 1000);
      fetchWaveform();
    }
  } else {
    if (waveTimer) { clearInterval(waveTimer); waveTimer = null; }
  }
});

async function fetchWaveform() {
  try {
    const r = await fetch('/api/waveform');
    const d = await r.json();
    if (!d.channels || d.channels.length === 0) return;
    document.getElementById('waveMeta').textContent = 'batch #' + d.batch_no;
    for (const ch of d.channels) {
      const idx = ch.ch - 1;
      if (!ch.wave_raw || !charts[idx]) continue;
      const raw = base64ToUint16LE(ch.wave_raw);
      const scaleF = ch.scale / POW20;
      const rangeF = ch.range / FFFF;
      const vals = [];
      for (let i = 0; i < raw.length; i++)
        vals.push([i, (raw[i] - ch.offset) * scaleF * rangeF]);
      charts[idx].setOption({ series: [{ data: vals }] }, { notMerge: false });
    }
  } catch(e) { /* ignore */ }
}

// Initial load
fetch('/api/status').then(r=>r.json()).then(d => {
  render({...d, channels: d.channels || [], features: d.features || []});
}).catch(() => {});

let resizeTimer = null;
window.addEventListener('resize', () => {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    for (const ch of charts) if (ch) ch.resize();
  }, 100);
});
connectSSE();
